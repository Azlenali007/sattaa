<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none">
  <defs>
    <!-- Background glow -->
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8C52FF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6425D9" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Ball 5 (Center) Gradient -->
    <radialGradient id="ball5Grad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#A575FF" />
      <stop offset="35%" stop-color="#6425D9" />
      <stop offset="75%" stop-color="#35156F" />
      <stop offset="100%" stop-color="#1B0645" />
    </radialGradient>

    <!-- Ball 8 (Left) Gradient -->
    <radialGradient id="ball8Grad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#9C6BFF" />
      <stop offset="40%" stop-color="#551DBF" />
      <stop offset="80%" stop-color="#280C5E" />
      <stop offset="100%" stop-color="#150438" />
    </radialGradient>

    <!-- Ball 9 (Right) Gradient -->
    <radialGradient id="ball9Grad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#B288FF" />
      <stop offset="40%" stop-color="#6425D9" />
      <stop offset="80%" stop-color="#35156F" />
      <stop offset="100%" stop-color="#1A0740" />
    </radialGradient>

    <!-- Number Inset Circle Gradient -->
    <radialGradient id="insetGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#EBE4FF" />
      <stop offset="100%" stop-color="#D3C2FF" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="crownGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6425D9" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="290" cy="210" rx="220" ry="140" fill="url(#heroGlow)" />

  <!-- Ground Shadows -->
  <ellipse cx="160" cy="300" rx="75" ry="24" fill="#200B4D" opacity="0.35" filter="url(#shadowBlur)" />
  <ellipse cx="280" cy="315" rx="95" ry="28" fill="#1B0742" opacity="0.45" filter="url(#shadowBlur)" />
  <ellipse cx="395" cy="295" rx="75" ry="22" fill="#200B4D" opacity="0.35" filter="url(#shadowBlur)" />

  <!-- Crown on Top of Main Ball -->
  <g transform="translate(242, 60)" filter="url(#crownGlow)">
    <path d="M7 60h66v8H7V60zm6.1-6.6l6.6-33 15.1 15.6L40 9.6l5.2 26.4 15.1-15.6 6.6 33H13.1zm26.9-34.6a4.3 4.3 0 100-8.6 4.3 4.3 0 000 8.6zm-20.9 8.6a4.3 4.3 0 100-8.6 4.3 4.3 0 000 8.6zm41.8 0a4.3 4.3 0 100-8.6 4.3 4.3 0 000 8.6z" fill="#6425D9" />
    <path d="M8 61h64v5H8V61zm6-6l6.4-31 14.6 15L39 12l5 27 14.6-15 6.4 31H14z" fill="#8445F0" />
    <!-- Jewels on crown -->
    <circle cx="40" cy="11" r="3.2" fill="#FFFFFF" />
    <circle cx="19" cy="20" r="3.2" fill="#FFFFFF" />
    <circle cx="61" cy="20" r="3.2" fill="#FFFFFF" />
  </g>

  <!-- Ball 8 (Front Left) -->
  <g id="ball-8">
    <circle cx="165" cy="235" r="72" fill="url(#ball8Grad)" />
    <!-- Gloss Highlight -->
    <ellipse cx="145" cy="195" rx="35" ry="18" transform="rotate(-30, 145, 195)" fill="#FFFFFF" opacity="0.4" filter="url(#shadowBlur)" />
    <!-- Number Inset Badge -->
    <circle cx="160" cy="235" r="34" fill="url(#insetGrad)" />
    <text x="160" y="249" font-family="'Inter', sans-serif" font-weight="900" font-size="38" fill="#191747" text-anchor="middle">8</text>
  </g>

  <!-- Ball 5 (Center Main) -->
  <g id="ball-5">
    <circle cx="280" cy="195" r="92" fill="url(#ball5Grad)" />
    <!-- Gloss Highlight -->
    <ellipse cx="255" cy="145" rx="48" ry="24" transform="rotate(-25, 255, 145)" fill="#FFFFFF" opacity="0.45" filter="url(#shadowBlur)" />
    <!-- Rim Light -->
    <circle cx="280" cy="195" r="90" stroke="#C5A3FF" stroke-width="2" opacity="0.3" />
    <!-- Number Inset Badge -->
    <circle cx="275" cy="195" r="44" fill="url(#insetGrad)" />
    <text x="275" y="213" font-family="'Inter', sans-serif" font-weight="900" font-size="50" fill="#191747" text-anchor="middle">5</text>
  </g>

  <!-- Ball 9 (Right) -->
  <g id="ball-9">
    <circle cx="395" cy="225" r="74" fill="url(#ball9Grad)" />
    <!-- Gloss Highlight -->
    <ellipse cx="375" cy="185" rx="35" ry="18" transform="rotate(-30, 375, 185)" fill="#FFFFFF" opacity="0.4" filter="url(#shadowBlur)" />
    <!-- Number Inset Badge -->
    <circle cx="390" cy="225" r="35" fill="url(#insetGrad)" />
    <text x="390" y="239" font-family="'Inter', sans-serif" font-weight="900" font-size="38" fill="#191747" text-anchor="middle">9</text>
  </g>

  <!-- Floating Sparkles -->
  <path d="M85 140l3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8z" fill="#9C6BFF" opacity="0.75" />
  <path d="M470 120l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5 2.5-6z" fill="#8C52FF" opacity="0.8" />
  <circle cx="110" cy="95" r="3" fill="#6425D9" opacity="0.5" />
  <circle cx="445" cy="70" r="4" fill="#9C6BFF" opacity="0.6" />
</svg>
